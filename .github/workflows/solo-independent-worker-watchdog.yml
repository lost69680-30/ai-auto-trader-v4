name: Solo Independent Worker Watchdog

on:
  push:
    branches:
      - feat/solo-independent-watchdog
    paths:
      - ".github/workflows/solo-independent-worker-watchdog.yml"
      - "docs/SOLO_INDEPENDENT_WORKER_WATCHDOG.md"
  pull_request:
    paths:
      - ".github/workflows/solo-independent-worker-watchdog.yml"
      - "docs/SOLO_INDEPENDENT_WORKER_WATCHDOG.md"
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: solo-independent-worker-watchdog
  cancel-in-progress: false

jobs:
  validate-workflow:
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate GitHub Actions workflow syntax
        uses: rhysd/actionlint@v1.7.7
      - name: Compile the embedded watchdog Python script
        run: |
          python -m pip install pyyaml
          python - <<'PY'
          from pathlib import Path
          import yaml

          workflow = yaml.load(
              Path(".github/workflows/solo-independent-worker-watchdog.yml").read_text(),
              Loader=yaml.BaseLoader,
          )
          shell = workflow["jobs"]["monitor-and-recover"]["steps"][0]["run"]
          marker = "python - <<'PY'\\n"
          start = shell.index(marker) + len(marker)
          end = shell.rfind("\\nPY")
          if end <= start:
              raise SystemExit("watchdog Python heredoc was not found")
          compile(shell[start:end], "solo_worker_watchdog.py", "exec")
          print("Watchdog Python syntax is valid.")
          PY

  monitor-and-recover:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Keep the worker awake, inspect its database heartbeat, and recover only confirmed failure
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          API_READY_URL: https://solo-ai-auto-trader-staging-api.onrender.com/readyz
          WORKER_LIVENESS_URL: https://solo-futures-websocket-staging.onrender.com/healthz
          RENDER_WORKER_SERVICE_ID: srv-dbhr5ign74is738detbg
        run: |
          python - <<'PY'
          import json
          import os
          import sys
          import time
          import urllib.error
          import urllib.request

          ready_url = os.environ["API_READY_URL"]
          worker_url = os.environ["WORKER_LIVENESS_URL"]
          service_id = os.environ["RENDER_WORKER_SERVICE_ID"]
          api_key = os.environ.get("RENDER_API_KEY", "").strip()
          confirmed_worker_failures = {"STALE", "STOPPED", "ERROR", "MISSING"}

          def get_json(url, timeout):
              request = urllib.request.Request(
                  url,
                  headers={"Accept": "application/json", "Cache-Control": "no-cache"},
                  method="GET",
              )
              try:
                  response = urllib.request.urlopen(request, timeout=timeout)
              except urllib.error.HTTPError as exc:
                  response = exc
              except Exception as exc:
                  return None, type(exc).__name__
              try:
                  return json.loads(response.read(4096).decode("utf-8")), None
              except Exception:
                  return None, "invalid JSON response"
              finally:
                  response.close()

          def keep_worker_awake():
              payload, error = get_json(worker_url, 90)
              valid = (
                  isinstance(payload, dict)
                  and payload.get("status") == "ok"
                  and payload.get("mode") == "PAPER_ONLY"
                  and payload.get("orders_authorized") is False
              )
              if valid:
                  print("Worker service liveness responded; free-tier service has been contacted.")
                  return True
              print(f"Worker liveness probe did not validate: {error or 'invalid or unsafe response'}")
              return False

          def readiness():
              payload, error = get_json(ready_url, 45)
              if not isinstance(payload, dict) or payload.get("orders_authorized") is not False:
                  return "indeterminate", None, error or "readiness response failed paper-only safety validation"
              worker_status = payload.get("worker_status")
              if payload.get("status") == "ready" and worker_status == "RUNNING":
                  return "healthy", worker_status, "worker lease and market readiness are healthy"
              if worker_status in confirmed_worker_failures:
                  return "worker_failed", worker_status, "API reports a stale or stopped worker heartbeat"
              return "indeterminate", worker_status, "API is reachable but worker failure is not confirmed"

          # Contact the worker's minimal liveness endpoint every ten minutes so its
          # free-tier web service does not sleep between scheduled heartbeat checks.
          worker_alive = keep_worker_awake()
          state, worker_status, reason = readiness()
          if state == "healthy":
              print("Independent readiness probe confirms healthy paper-only worker; no restart needed.")
              sys.exit(0)

          print(f"Readiness probe: state={state}, worker_status={worker_status}, reason={reason}")
          if state != "worker_failed":
              print("::error::Worker failure is not confirmed; refusing an unsafe or unnecessary restart.")
              sys.exit(1)

          # Give a recently awakened free-tier worker time to publish its first lease.
          if worker_alive:
              print("Worker process is reachable; allowing 60 seconds for heartbeat renewal before considering restart.")
              time.sleep(60)
              state, worker_status, reason = readiness()
              if state == "healthy":
                  print("Worker heartbeat recovered during startup grace; no restart needed.")
                  sys.exit(0)
              if state != "worker_failed":
                  print("::error::Worker heartbeat remains indeterminate; refusing restart.")
                  sys.exit(1)

          if not api_key:
              print("::error::RENDER_API_KEY is not configured; worker failure detected but restart is unavailable.")
              sys.exit(1)

          # One restart request per run, and only after the separate API confirms a stale worker lease.
          restart_url = f"https://api.render.com/v1/services/{service_id}/restart"
          request = urllib.request.Request(
              restart_url,
              data=b"",
              headers={
                  "Authorization": f"Bearer {api_key}",
                  "Accept": "application/json",
              },
              method="POST",
          )
          try:
              with urllib.request.urlopen(request, timeout=30) as response:
                  if response.status not in (200, 202):
                      raise RuntimeError(f"Render restart returned HTTP {response.status}")
          except urllib.error.HTTPError as exc:
              raise SystemExit(f"Render restart request failed with HTTP {exc.code}") from None
          except Exception as exc:
              raise SystemExit(f"Render restart request failed: {type(exc).__name__}") from None

          print("Render accepted one worker-service restart request; verifying database-backed recovery.")
          for attempt in range(1, 7):
              time.sleep(20)
              keep_worker_awake()
              state, worker_status, reason = readiness()
              if state == "healthy":
                  print(f"Worker lease and market readiness recovered (check {attempt}/6).")
                  sys.exit(0)
              print(f"Recovery check {attempt}/6: state={state}, worker_status={worker_status}, reason={reason}")

          print("::error::Worker did not return to healthy readiness within the verification window.")
          sys.exit(1)
          PY
