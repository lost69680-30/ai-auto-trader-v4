name: Solo Independent Worker Watchdog

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: solo-independent-worker-watchdog
  cancel-in-progress: false

jobs:
  monitor-and-recover:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Check worker liveness and recover service if unreachable
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          WORKER_HEALTH_URL: https://solo-futures-websocket-staging.onrender.com/healthz
          RENDER_SERVICE_ID: srv-dbhr5ign74is738detbg
        run: |
          python - <<'PY'
          import json
          import os
          import sys
          import time
          import urllib.error
          import urllib.request

          health_url = os.environ["WORKER_HEALTH_URL"]
          service_id = os.environ["RENDER_SERVICE_ID"]
          api_key = os.environ.get("RENDER_API_KEY", "").strip()

          def healthy():
              request = urllib.request.Request(
                  health_url,
                  headers={"Accept": "application/json", "Cache-Control": "no-cache"},
                  method="GET",
              )
              try:
                  with urllib.request.urlopen(request, timeout=100) as response:
                      if response.status != 200:
                          return False, f"HTTP {response.status}"
                      payload = json.loads(response.read(4096).decode("utf-8"))
              except Exception as exc:
                  return False, type(exc).__name__
              valid = (
                  isinstance(payload, dict)
                  and payload.get("status") == "ok"
                  and payload.get("mode") == "PAPER_ONLY"
                  and payload.get("orders_authorized") is False
              )
              return valid, "valid paper-only liveness response" if valid else "invalid or unsafe health payload"

          ok, reason = healthy()
          if ok:
              print("Worker service liveness is healthy; no recovery action needed.")
              sys.exit(0)

          print(f"Worker health probe failed: {reason}")
          if not api_key:
              print("::error::RENDER_API_KEY is not configured; independent restart is unavailable.")
              sys.exit(1)

          # One restart request per run; never loop restart calls or touch trading APIs.
          restart_url = f"https://api.render.com/v1/services/{service_id}/restart"
          request = urllib.request.Request(
              restart_url,
              data=b"",
              headers={
                  "Authorization": f"Bearer {api_key}",
                  "Accept": "application/json",
              },
              method="POST",
          )
          try:
              with urllib.request.urlopen(request, timeout=30) as response:
                  if response.status not in (200, 202):
                      raise RuntimeError(f"Render restart returned HTTP {response.status}")
          except urllib.error.HTTPError as exc:
              raise SystemExit(f"Render restart request failed with HTTP {exc.code}") from None
          except Exception as exc:
              raise SystemExit(f"Render restart request failed: {type(exc).__name__}") from None

          print("Render accepted one worker-service restart request; verifying recovery.")
          for attempt in range(1, 7):
              time.sleep(20)
              ok, reason = healthy()
              if ok:
                  print(f"Worker liveness recovered after restart (check {attempt}/6).")
                  sys.exit(0)
              print(f"Recovery check {attempt}/6 not healthy: {reason}")

          print("::error::Worker service did not recover within the verification window.")
          sys.exit(1)
          PY
