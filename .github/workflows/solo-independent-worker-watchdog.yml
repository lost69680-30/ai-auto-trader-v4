name: Solo Independent Worker Watchdog

on:
  push:
    branches:
      - test/solo-independent-watchdog-smoke
    paths:
      - ".github/workflows/solo-independent-worker-watchdog.yml"
  pull_request:
    paths:
      - ".github/workflows/solo-independent-worker-watchdog.yml"
      - "scripts/solo_independent_watchdog.py"
      - "tests/test_solo_independent_watchdog.py"
      - "docs/SOLO_INDEPENDENT_WORKER_WATCHDOG.md"
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: solo-independent-worker-watchdog-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate-workflow:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate GitHub Actions workflow syntax
        uses: reviewdog/action-actionlint@v1
      - name: Compile watchdog and run classification tests
        run: |
          python -m py_compile scripts/solo_independent_watchdog.py
          python -m unittest discover -s tests -p 'test_solo_independent_watchdog.py' -v

  monitor-and-recover:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || github.event_name == 'push' || github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Keep worker awake, inspect independent heartbeat, and recover confirmed failure
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          API_READY_URL: https://solo-ai-auto-trader-staging-api.onrender.com/readyz
          WORKER_LIVENESS_URL: https://solo-futures-websocket-staging.onrender.com/healthz
          RENDER_WORKER_SERVICE_ID: srv-dbhr5ign74is738detbg
        run: python scripts/solo_independent_watchdog.py
