name: Solo Independent Worker Heartbeat Monitor

on:
  pull_request:
    paths:
      - ".github/workflows/solo-independent-worker-watchdog.yml"
      - "scripts/solo_heartbeat_monitor.py"
      - "tests/test_solo_heartbeat_monitor.py"
      - "docs/SOLO_INDEPENDENT_WORKER_WATCHDOG.md"
      - ".github/workflows/solo-render-keepwarm.yml"
  push:
    branches: [fix/solo-readonly-heartbeat-monitor-20261107]
    paths:
      - "scripts/solo_heartbeat_monitor.py"
      - ".github/workflows/solo-independent-worker-watchdog.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: solo-independent-worker-monitor-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate-monitor:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Validate GitHub Actions workflow syntax
        uses: reviewdog/action-actionlint@v1
      - name: Install monitor test dependencies
        run: python -m pip install pytest
      - name: Compile monitor and run classification tests
        run: |
          python -m py_compile scripts/solo_heartbeat_monitor.py
          python -m pytest -q tests/test_solo_heartbeat_monitor.py

  monitor:
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install read-only PostgreSQL client
        run: python -m pip install "psycopg[binary]==3.3.6"
      - name: Inspect worker health, keep live service warm, and wake only after a confirmed stop
        env:
          SOLO_BACKUP_DATABASE_URL: ${{ secrets.SOLO_BACKUP_DATABASE_URL }}
          PAPER_WORKER_ID: solo-market-worker
          PAPER_SYMBOLS: BTCUSDT,ETHUSDT,BNBUSDT,SOLUSDT,XRPUSDT,ADAUSDT,DOGEUSDT,TRXUSDT,LINKUSDT,AVAXUSDT
          PAPER_MAX_MARKET_AGE_SECONDS: "90"
          PAPER_MAX_SCHEDULER_STALE_SECONDS: "900"
        run: python scripts/solo_heartbeat_monitor.py
