name: Solo V4 Cached Chart APK
# Trigger build after workflow is registered.

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/build-solo-v4-cache-test.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Verify project files
        run: |
          set -euo pipefail
          test -f settings.gradle.kts
          test -f android/app/build.gradle.kts
          test -f android/app/src/main/java/com/aiautotrader/v4/MainActivity.kt
      - name: Cache validated candles across screen navigation
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path("android/app/src/main/java/com/aiautotrader/v4/MainActivity.kt")
          source = path.read_text(encoding="utf-8")

          # Promote candle history above the composable lifecycle.
          state_line = '    val marketMessage = mutableStateOf("Market data has not been loaded yet.")'
          if "val candleHistoryBySymbol =" not in source:
              if state_line not in source:
                  raise SystemExit("STOP: market session state insertion point not found.")
              source = source.replace(
                  state_line,
                  state_line + "\n    // Retain validated closed candles when users switch screens.\n"
                  "    val candleHistoryBySymbol = mutableStateOf<Map<String, Map<String, List<MarketCandle>>>>(emptyMap())",
                  1,
              )

          # Keep the last good market snapshot on transient/empty backend responses.
          market_pattern = re.compile(
              r'if \(!response\.backendConnected \|\| !response\.safeResponse \|\| '
              r'response\.feedStatus != "HEALTHY" \|\| response\.items\.isEmpty\(\)\) \{\s*'
              r'BackendSession\.marketItems\.value = emptyList\(\)\s*\} else \{\s*'
              r'BackendSession\.marketItems\.value = response\.items\s*\}',
              re.MULTILINE,
          )
          keep_market = (
              '// Retain the last validated snapshot while the feed reconnects.\n'
              '                if (response.backendConnected && response.safeResponse &&\n'
              '                    response.feedStatus == "HEALTHY" && response.items.isNotEmpty()) {\n'
              '                    BackendSession.marketItems.value = response.items\n'
              '                }'
          )
          if "Retain the last validated snapshot while the feed reconnects." not in source:
              source, count = market_pattern.subn(keep_market, source, count=1)
              if count != 1:
                  raise SystemExit("STOP: could not safely locate market refresh block.")

          # Cache each symbol's timeframe history; empty/failed refreshes cannot erase it.
          start_marker = "    var candleHistoryByTimeframe by remember"
          end_marker = "    val timeframeSnapshots = remember"
          start = source.find(start_marker)
          end = source.find(end_marker, start)
          if start >= 0 and end > start:
              new_block = '''    val candleSymbolKey = normalizeSymbol(selectedMarket?.symbol ?: symbol)
              val candleHistoryByTimeframe =
                  BackendSession.candleHistoryBySymbol.value[candleSymbolKey].orEmpty()
              var candleHistoryLoading by remember { mutableStateOf(false) }
              LaunchedEffect(sessionToken, selectedMarket?.symbol, candleSymbolKey) {
                  if (sessionToken.length >= 32 && candleSymbolKey.isNotBlank()) {
                      while (true) {
                          candleHistoryLoading = true
                          val history = withContext(Dispatchers.IO) {
                              try { fetchCandleHistory(sessionToken, selectedMarket?.symbol ?: symbol) }
                              catch (_: Exception) { emptyMap() }
                          }
                          if (history.isNotEmpty()) {
                              BackendSession.candleHistoryBySymbol.value =
                                  BackendSession.candleHistoryBySymbol.value + (candleSymbolKey to history)
                          }
                          candleHistoryLoading = false
                          delay(60_000)
                      }
                  } else {
                      candleHistoryLoading = false
                  }
              }
          '''
              source = source[:start] + new_block + source[end:]
          elif "val candleHistoryByTimeframe =" not in source:
              raise SystemExit("STOP: candle history block not found.")
          
          checks = [
              "val candleHistoryBySymbol =" in source,
              "BackendSession.candleHistoryBySymbol.value[candleSymbolKey].orEmpty()" in source,
              "Retain the last validated snapshot while the feed reconnects." in source,
              "if (history.isNotEmpty())" in source,
          ]
          if not all(checks):
              raise SystemExit("STOP: candle cache verification failed.")
          path.write_text(source, encoding="utf-8")
          print("PASS: persistent candle cache and last-good market snapshot retention patched.")
          PY
      - name: Build debug APK
        run: |
          set -euo pipefail
          gradle :android:app:assembleDebug -PpaperApiBaseUrl=https://ai-auto-trader-v4-backend.onrender.com --no-daemon
          test -s android/app/build/outputs/apk/debug/app-debug.apk
          sha256sum android/app/build/outputs/apk/debug/app-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: solo-v4-debug-apk-check
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
