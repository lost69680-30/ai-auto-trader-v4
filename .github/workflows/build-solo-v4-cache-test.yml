name: Solo V4 Cached Chart APK
# Trigger build after workflow is registered.

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/build-solo-v4-cache-test.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Verify project files
        run: |
          set -euo pipefail
          test -f settings.gradle.kts
          test -f android/app/build.gradle.kts
          test -f android/app/src/main/java/com/aiautotrader/v4/MainActivity.kt
      - name: Cache validated candles across screen navigation
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path("android/app/src/main/java/com/aiautotrader/v4/MainActivity.kt")
          source = path.read_text(encoding="utf-8")
          old_state = "\\n".join([
              '    val marketMessage = mutableStateOf("Market data has not been loaded yet.")',
              '}'
          ])
          new_state = "\\n".join([
              '    val marketMessage = mutableStateOf("Market data has not been loaded yet.")',
              '    // Retain validated closed candle history across screen navigation.',
              '    val candleHistoryBySymbol =',
              '        mutableStateOf<Map<String, Map<String, List<MarketCandle>>>>(emptyMap())',
              '}'
          ])
          if "val candleHistoryBySymbol =" not in source:
              if old_state not in source:
                  raise SystemExit("STOP: session state insertion point not found.")
              source = source.replace(old_state, new_state, 1)

          start_marker = "    var candleHistoryByTimeframe by remember"
          end_marker = "    val timeframeSnapshots = remember"
          if "val candleHistoryByTimeframe =" not in source:
              start = source.find(start_marker)
              end = source.find(end_marker, start)
              if start < 0 or end < 0:
                  raise SystemExit("STOP: candle history block markers not found.")
              new_block = "\\n".join([
                  '    val candleSymbolKey = normalizeSymbol(selectedMarket?.symbol.orEmpty())',
                  '    val candleHistoryByTimeframe =',
                  '        BackendSession.candleHistoryBySymbol.value[candleSymbolKey].orEmpty()',
                  '    var candleHistoryLoading by remember { mutableStateOf(false) }',
                  '    LaunchedEffect(sessionToken, selectedMarket?.symbol) {',
                  '        if (sessionToken.length >= 32 && selectedMarket != null) {',
                  '            while (true) {',
                  '                candleHistoryLoading = true',
                  '                val history = withContext(Dispatchers.IO) {',
                  '                    try { fetchCandleHistory(sessionToken, selectedMarket.symbol) } catch (_: Exception) { emptyMap() }',
                  '                }',
                  '                // Preserve the last usable chart if refresh fails or returns empty data.',
                  '                if (history.isNotEmpty()) {',
                  '                    BackendSession.candleHistoryBySymbol.value =',
                  '                        BackendSession.candleHistoryBySymbol.value + (candleSymbolKey to history)',
                  '                }',
                  '                candleHistoryLoading = false',
                  '                delay(60_000)',
                  '            }',
                  '        } else {',
                  '            candleHistoryLoading = false',
                  '        }',
                  '    }',
                  ''
              ])
              source = source[:start] + new_block + source[end:]
          if "val candleHistoryBySymbol =" not in source or "Preserve the last usable chart" not in source:
              raise SystemExit("STOP: cache source checks failed.")
          path.write_text(source, encoding="utf-8")
          print("PASS: validated candle cache patch.")
          PY
      - name: Build debug APK
        run: |
          set -euo pipefail
          gradle :android:app:assembleDebug -PpaperApiBaseUrl=https://ai-auto-trader-v4-backend.onrender.com --no-daemon
          test -s android/app/build/outputs/apk/debug/app-debug.apk
          sha256sum android/app/build/outputs/apk/debug/app-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: solo-v4-debug-apk-check
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
