
name: Solo V4 Market Data Fix APK Build

on:
  workflow_dispatch:
  push:
    paths:
      - 'ai-auto-trader-v4-market-data-session-fix-v1.zip'
      - '.github/workflows/build-market-data-session-fix.yml'

permissions:
  contents: read

concurrency:
  group: solo-market-data-session-fix
  cancel-in-progress: false

jobs:
  build-debug-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract corrected Solo source
        shell: bash
        run: |
          set -euo pipefail
          PROJECT_ZIP="ai-auto-trader-v4-market-data-session-fix-v1.zip"
          test -s "$PROJECT_ZIP"
          mkdir -p extracted-project
          unzip -q "$PROJECT_ZIP" -d extracted-project
          PROJECT_DIR="extracted-project/ai-auto-trader-v4-assembly"
          test -f "$PROJECT_DIR/settings.gradle.kts"
          test -f "$PROJECT_DIR/android/app/build.gradle.kts"
          test -f "$PROJECT_DIR/android/app/src/main/java/com/aiautotrader/v4/MainActivity.kt"
          test -f "$PROJECT_DIR/android/app/src/main/java/com/aiautotrader/v4/BackendTokenStore.kt"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Verify market-data and safety checks
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import os

          source = (
              Path(os.environ["PROJECT_DIR"])
              / "android/app/src/main/java/com/aiautotrader/v4/MainActivity.kt"
          ).read_text(encoding="utf-8")

          checks = {
              "Shared backend session": "private object BackendSession" in source,
              "Authenticated market endpoint": 'get("/api/v1/markets")' in source,
              "Paper-only mode": 'statusJson.optString("mode") == "PAPER_ONLY"' in source,
              "Orders disabled": '!statusJson.optBoolean("orders_authorized", true)' in source,
              "Validated closed candles": 'c.optBoolean("is_closed", false) && valid' in source,
              "Mock candles removed": "Clearly labelled illustrative values" not in source,
              "Periodic refresh": "LaunchedEffect(sessionToken)" in source and "delay(30_000)" in source,
          }

          for name, passed in checks.items():
              print(f"{'PASS' if passed else 'FAIL'}: {name}")

          if not all(checks.values()):
              raise SystemExit("Market-data regression checks failed")
          PY

      - name: Configure Android build
        shell: bash
        run: |
          set -euo pipefail
          touch "$PROJECT_DIR/gradle.properties"
          grep -q '^android.useAndroidX=true$' "$PROJECT_DIR/gradle.properties" || echo 'android.useAndroidX=true' >> "$PROJECT_DIR/gradle.properties"
          grep -q '^org.gradle.jvmargs=' "$PROJECT_DIR/gradle.properties" || echo 'org.gradle.jvmargs=-Xmx2g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8' >> "$PROJECT_DIR/gradle.properties"
          echo 'kotlin.daemon.jvmargs=-Xmx1g' >> "$PROJECT_DIR/gradle.properties"

      - name: Build corrected debug APK
        shell: bash
        run: |
          set -euo pipefail
          gradle -p "$PROJECT_DIR" :android:app:assembleDebug \
            -PpaperApiBaseUrl=https://ai-auto-trader-v4-backend.onrender.com \
            --no-daemon

      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail
          APK="$PROJECT_DIR/android/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          ls -lh "$APK"
          sha256sum "$APK"

      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: solo-v4-market-data-session-fix-debug-apk
          path: extracted-project/ai-auto-trader-v4-assembly/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload corrected source
        uses: actions/upload-artifact@v4
        with:
          name: solo-v4-market-data-session-fix-source
          path: ai-auto-trader-v4-market-data-session-fix-v1.zip
          if-no-files-found: error
          retention-days: 14
