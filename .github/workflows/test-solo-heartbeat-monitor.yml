name: Solo read-only heartbeat monitor tests

on:
  pull_request:
    paths:
      - "scripts/solo_heartbeat_monitor.py"
      - "tests/test_solo_heartbeat_monitor.py"
      - ".github/workflows/test-solo-heartbeat-monitor.yml"
  push:
    branches: [main]
    paths:
      - "scripts/solo_heartbeat_monitor.py"
      - "tests/test_solo_heartbeat_monitor.py"
      - ".github/workflows/test-solo-heartbeat-monitor.yml"

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test runner
        run: python -m pip install pytest
      - name: Run monitor classification tests
        run: python -m pytest -q tests/test_solo_heartbeat_monitor.py
