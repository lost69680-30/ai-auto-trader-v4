name: Solo staging PostgreSQL restore drill

on:
  # Monthly independent restore validation. The weekly encrypted-backup workflow
  # already performs a full disposable restore before publishing its ciphertext.
  schedule:
    - cron: "0 7 1 * *"
  pull_request:
    paths:
      - ".github/workflows/solo-staging-db-restore-drill.yml"
      - "tests/test_solo_staging_db_restore_contract.py"
  workflow_dispatch:
    inputs:
      confirm_staging_only:
        description: "I confirm this is a read-only export from solo-ai-auto-trader-staging only"
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: solo-staging-db-restore-drill
  cancel-in-progress: false

jobs:
  restore-into-disposable-postgres:
    name: Read-only export and restore into temporary PostgreSQL 17
    if: github.event_name == 'schedule' || github.event_name == 'pull_request' || inputs.confirm_staging_only == true
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: restore_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d restore_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - name: Install PostgreSQL client
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes postgresql-client

      - name: Preflight the dedicated read-only staging role and current schema
        env:
          DATABASE_URL: ${{ secrets.SOLO_BACKUP_DATABASE_URL }}
          PGOPTIONS: "-c default_transaction_read_only=on"
          PGSSLMODE: require
        run: |
          set -euo pipefail
          set +x
          if [ -z "${DATABASE_URL:-}" ]; then
            echo "::error::Missing SOLO_BACKUP_DATABASE_URL Actions secret."
            exit 1
          fi

          current_user="$(psql "$DATABASE_URL" -X -A -t -v ON_ERROR_STOP=1 -c "SELECT current_user")"
          if [ "$current_user" != "solo_backup_reader" ]; then
            echo "::error::Restore drill requires solo_backup_reader; refusing a privileged or unexpected database role."
            exit 1
          fi

          role_safety="$(psql "$DATABASE_URL" -X -A -t -v ON_ERROR_STOP=1 -c "
            SELECT CASE WHEN rolsuper OR rolbypassrls OR rolinherit OR NOT rolcanlogin
              THEN 'unsafe' ELSE 'safe' END
            FROM pg_roles WHERE rolname=current_user")"
          if [ "$role_safety" != "safe" ]; then
            echo "::error::Backup role has unsafe role attributes; refusing to continue."
            exit 1
          fi

          expected_tables=(
            paper_orders paper_fills paper_positions paper_funding_events
            paper_audit_events paper_system_controls paper_order_cancellations
            paper_position_extrema paper_equity_snapshots market_feed_snapshots
            market_worker_heartbeats scheduled_job_definitions scheduled_jobs
            market_candles market_intelligence_reports opportunities
            opportunity_assessments opportunity_evidence opportunity_watch_conditions
            opportunity_events opportunity_claims strategy_research_experiments
          )
          expected_csv="$(IFS=,; echo "${expected_tables[*]}")"
          table_count="$(psql "$DATABASE_URL" -X -A -t -v ON_ERROR_STOP=1 -c "
            SELECT count(*) FROM pg_class c
            JOIN pg_namespace n ON n.oid=c.relnamespace
            WHERE n.nspname='paper_ledger' AND c.relkind='r'")"
          missing_count="$(psql "$DATABASE_URL" -X -A -t -v ON_ERROR_STOP=1 -c "
            SELECT count(*) FROM unnest(string_to_array('$expected_csv', ',')) AS expected(name)
            WHERE to_regclass('paper_ledger.' || quote_ident(expected.name)) IS NULL")"
          unsafe_count="$(psql "$DATABASE_URL" -X -A -t -v ON_ERROR_STOP=1 -c "
            SELECT count(*) FROM pg_class c
            JOIN pg_namespace n ON n.oid=c.relnamespace
            WHERE n.nspname='paper_ledger' AND c.relkind='r'
              AND (NOT c.relrowsecurity OR NOT EXISTS (
                SELECT 1 FROM pg_policies p
                WHERE p.schemaname='paper_ledger'
                  AND p.tablename=c.relname
                  AND p.policyname='solo_backup_reader_select'
                  AND 'solo_backup_reader'=ANY(p.roles)
                  AND p.cmd IN ('SELECT','ALL')
              ))")"
          privilege_violations="$(psql "$DATABASE_URL" -X -A -t -v ON_ERROR_STOP=1 -c "
            SELECT count(*) FROM pg_class c
            JOIN pg_namespace n ON n.oid=c.relnamespace
            WHERE n.nspname='paper_ledger' AND c.relkind='r'
              AND (NOT has_table_privilege(current_user,c.oid,'SELECT')
                OR has_table_privilege(current_user,c.oid,'INSERT')
                OR has_table_privilege(current_user,c.oid,'UPDATE')
                OR has_table_privilege(current_user,c.oid,'DELETE')
                OR has_table_privilege(current_user,c.oid,'TRUNCATE')
                OR has_table_privilege(current_user,c.oid,'REFERENCES')
                OR has_table_privilege(current_user,c.oid,'TRIGGER'))")"
          schema_create="$(psql "$DATABASE_URL" -X -A -t -v ON_ERROR_STOP=1 -c "
            SELECT has_schema_privilege(current_user,'paper_ledger','CREATE')")"

          if [ "$table_count" -lt "${#expected_tables[@]}" ] || [ "$missing_count" -ne 0 ] \
            || [ "$unsafe_count" -ne 0 ] || [ "$privilege_violations" -ne 0 ] \
            || [ "$schema_create" != "f" ]; then
            echo "::error::Read-only/RLS preflight failed: tables=$table_count missing=$missing_count unsafe_RLS_or_policy=$unsafe_count write_or_admin_grants=$privilege_violations schema_CREATE=$schema_create. No dump was started."
            exit 1
          fi
          echo "PASS: current staging schema has $table_count tables, including all ${#expected_tables[@]} required tables; every table has RLS and the explicit backup-reader SELECT policy; no write/admin grants were found."

      - name: Export only the staging paper_ledger schema
        env:
          DATABASE_URL: ${{ secrets.SOLO_BACKUP_DATABASE_URL }}
          PGOPTIONS: "-c default_transaction_read_only=on"
          PGSSLMODE: require
        run: |
          set -euo pipefail
          set +x
          pg_dump --format=custom --enable-row-security --inserts --no-owner --no-acl \
            --schema=paper_ledger --file=solo-paper-ledger.restore-test.dump "$DATABASE_URL"
          test -s solo-paper-ledger.restore-test.dump
          pg_restore --list solo-paper-ledger.restore-test.dump >/dev/null
          echo "PASS: paper_ledger dump created from the dedicated read-only staging role."

      - name: Restore and validate data in disposable PostgreSQL 17
        env:
          TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/restore_test
        run: |
          set -euo pipefail
          # Recreate only the non-login role referenced by private-schema RLS policies.
          # The disposable test database receives no connection to staging.
          psql "$TEST_DATABASE_URL" -X -v ON_ERROR_STOP=1 -c \
            "CREATE ROLE solo_backup_reader NOLOGIN NOINHERIT"
          pg_restore --exit-on-error --no-owner --no-acl \
            --dbname="$TEST_DATABASE_URL" solo-paper-ledger.restore-test.dump

          expected_tables=(
            paper_orders paper_fills paper_positions paper_funding_events
            paper_audit_events paper_system_controls paper_order_cancellations
            paper_position_extrema paper_equity_snapshots market_feed_snapshots
            market_worker_heartbeats scheduled_job_definitions scheduled_jobs
            market_candles market_intelligence_reports opportunities
            opportunity_assessments opportunity_evidence opportunity_watch_conditions
            opportunity_events opportunity_claims strategy_research_experiments
          )
          expected_csv="$(IFS=,; echo "${expected_tables[*]}")"
          table_count="$(psql "$TEST_DATABASE_URL" -X -A -t -v ON_ERROR_STOP=1 -c "
            SELECT count(*) FROM information_schema.tables
            WHERE table_schema='paper_ledger' AND table_type='BASE TABLE'")"
          missing_count="$(psql "$TEST_DATABASE_URL" -X -A -t -v ON_ERROR_STOP=1 -c "
            SELECT count(*) FROM unnest(string_to_array('$expected_csv', ',')) AS expected(name)
            WHERE to_regclass('paper_ledger.' || quote_ident(expected.name)) IS NULL")"
          rls_count="$(psql "$TEST_DATABASE_URL" -X -A -t -v ON_ERROR_STOP=1 -c "
            SELECT count(*) FROM pg_class c
            JOIN pg_namespace n ON n.oid=c.relnamespace
            WHERE n.nspname='paper_ledger' AND c.relkind='r' AND c.relrowsecurity")"
          candle_count="$(psql "$TEST_DATABASE_URL" -X -A -t -v ON_ERROR_STOP=1 -c "
            SELECT count(*) FROM paper_ledger.market_candles")"
          audit_count="$(psql "$TEST_DATABASE_URL" -X -A -t -v ON_ERROR_STOP=1 -c "
            SELECT count(*) FROM paper_ledger.paper_audit_events")"
          report_count="$(psql "$TEST_DATABASE_URL" -X -A -t -v ON_ERROR_STOP=1 -c "
            SELECT count(*) FROM paper_ledger.market_intelligence_reports")"
          research_count="$(psql "$TEST_DATABASE_URL" -X -A -t -v ON_ERROR_STOP=1 -c "
            SELECT count(*) FROM paper_ledger.strategy_research_experiments")"
          stop_control_count="$(psql "$TEST_DATABASE_URL" -X -A -t -v ON_ERROR_STOP=1 -c "
            SELECT count(*) FROM paper_ledger.paper_system_controls
            WHERE control_key='emergency_stop' AND active IN (0,1)")"

          if [ "$table_count" -lt "${#expected_tables[@]}" ] || [ "$missing_count" -ne 0 ] \
            || [ "$rls_count" -ne "$table_count" ] || [ "$candle_count" -lt 1 ] \
            || [ "$audit_count" -lt 1 ] || [ "$report_count" -lt 1 ] \
            || [ "$research_count" -lt 1 ] || [ "$stop_control_count" -ne 1 ]; then
            echo "::error::Disposable restore failed: tables=$table_count missing=$missing_count RLS=$rls_count candles=$candle_count audit=$audit_count reports=$report_count research=$research_count emergency_stop_rows=$stop_control_count"
            exit 1
          fi

          echo "PASS: all ${#expected_tables[@]} required current tables restored; $table_count tables have RLS; $candle_count candles, $audit_count audit events, $report_count market reports and $research_count research records restored; Emergency Stop control row is present."
          echo "This drill used a read-only staging connection and modified neither staging nor production."

      - name: Remove temporary plaintext dump
        if: always()
        run: rm -f solo-paper-ledger.restore-test.dump
