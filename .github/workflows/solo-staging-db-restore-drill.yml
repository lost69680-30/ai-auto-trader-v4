name: Solo staging PostgreSQL restore drill

on:
  workflow_dispatch:
    inputs:
      backup_run_id:
        description: "GitHub Actions run ID of a successful Solo staging PostgreSQL backup"
        required: true
        type: string
        default: "41207086389"
  push:
    branches:
      - fix/solo-restore-validation

permissions:
  actions: read
  contents: read

jobs:
  restore-into-disposable-postgres:
    name: Restore backup into temporary PostgreSQL 17
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: restore_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d restore_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install --yes postgresql-client

      - name: Download selected backup artifact
        uses: actions/download-artifact@v4
        with:
          name: solo-staging-paper-ledger-backup-${{ inputs.backup_run_id || '41207086389' }}
          run-id: ${{ inputs.backup_run_id || '41207086389' }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: backup

      - name: Verify archive and restore into disposable database
        env:
          TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/restore_test
        run: |
          set -euo pipefail
          cd backup
          sha256sum --check solo-paper-ledger.dump.sha256
          pg_restore --list solo-paper-ledger.dump >/dev/null
          # Recreate the role name referenced by the archive's RLS policies.
          # It has no login and receives no privileges in this disposable DB.
          psql "$TEST_DATABASE_URL" -v ON_ERROR_STOP=1 -c \
            "CREATE ROLE solo_backup_reader NOLOGIN NOINHERIT"
          pg_restore --exit-on-error --no-owner --no-acl \
            --dbname="$TEST_DATABASE_URL" solo-paper-ledger.dump

          expected_tables=(
            paper_orders paper_fills paper_positions paper_funding_events
            paper_audit_events paper_system_controls paper_order_cancellations
            paper_position_extrema paper_equity_snapshots market_feed_snapshots
            market_worker_heartbeats scheduled_job_definitions scheduled_jobs
            market_candles
          )
          expected_csv="$(IFS=,; echo "${expected_tables[*]}")"
          table_count="$(psql "$TEST_DATABASE_URL" -At -v ON_ERROR_STOP=1 -c \
            "SELECT count(*) FROM information_schema.tables
             WHERE table_schema='paper_ledger' AND table_type='BASE TABLE'")"
          missing_count="$(psql "$TEST_DATABASE_URL" -At -v ON_ERROR_STOP=1 -c \
            "SELECT count(*) FROM unnest(string_to_array('$expected_csv', ',')) AS expected(name)
             WHERE to_regclass('paper_ledger.' || quote_ident(expected.name)) IS NULL")"
          rls_count="$(psql "$TEST_DATABASE_URL" -At -v ON_ERROR_STOP=1 -c \
            "SELECT count(*) FROM pg_class c
             JOIN pg_namespace n ON n.oid=c.relnamespace
             WHERE n.nspname='paper_ledger' AND c.relkind='r' AND c.relrowsecurity")"
          primary_key_count="$(psql "$TEST_DATABASE_URL" -At -v ON_ERROR_STOP=1 -c \
            "SELECT count(*) FROM pg_constraint con
             JOIN pg_class c ON c.oid=con.conrelid
             JOIN pg_namespace n ON n.oid=c.relnamespace
             WHERE n.nspname='paper_ledger' AND con.contype='p'")"
          candle_count="$(psql "$TEST_DATABASE_URL" -At -v ON_ERROR_STOP=1 -c \
            "SELECT count(*) FROM paper_ledger.market_candles")"
          if [ "$table_count" -ne 14 ] || [ "$missing_count" -ne 0 ] || \
             [ "$rls_count" -ne 14 ] || [ "$primary_key_count" -ne 14 ] || \
             [ "$candle_count" -lt 1 ]; then
            echo "::error::Restore validation failed: tables=$table_count missing=$missing_count rls=$rls_count primary_keys=$primary_key_count candles=$candle_count"
            exit 1
          fi
          echo "PASS: checksum valid; all 14 expected tables restored; all 14 have RLS and primary keys; $candle_count candles restored into disposable PostgreSQL 17."
          echo "This drill did not connect to or modify staging or production databases."
