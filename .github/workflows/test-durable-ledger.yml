name: Durable Paper Ledger Tests

on:
  push:
    branches:
      - feature/supabase-durable-ledger
    paths:
      - 'extracted-source/ai-auto-trader-v4-assembly/**'
      - 'supabase/migrations/**'
      - '.github/workflows/test-durable-ledger.yml'
  pull_request:
    paths:
      - 'extracted-source/ai-auto-trader-v4-assembly/**'
      - 'supabase/migrations/**'
      - '.github/workflows/test-durable-ledger.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  postgres-ledger-tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: paper_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d paper_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      PAPER_TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/paper_test
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install package and test dependencies
        working-directory: extracted-source/ai-auto-trader-v4-assembly
        run: python -m pip install -e '.[test]'
      - name: Run PostgreSQL ledger integration tests
        working-directory: extracted-source/ai-auto-trader-v4-assembly
        run: python -m pytest -q tests/test_postgres_paper_ledger.py
      - name: Run complete backend test suite
        working-directory: extracted-source/ai-auto-trader-v4-assembly
        run: python -m pytest -q
