name: Solo staging health and worker recovery check

on:
  workflow_dispatch:
  push:
    branches:
      - fix/futures-context-mainline
    paths:
      - ".github/workflows/solo-staging-health-check.yml"

permissions:
  contents: read

concurrency:
  group: solo-staging-health-check
  cancel-in-progress: false

jobs:
  health:
    name: Check API liveness and shared-worker readiness
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      BASE_URL: https://solo-futures-websocket-staging.onrender.com
    steps:
      - name: Check public API liveness
        run: |
          set -euo pipefail
          curl --silent --show-error --fail --retry 8 --retry-delay 10 --retry-all-errors \
            "$BASE_URL/healthz" --output health.json
          python - <<'PY'
          import json
          from pathlib import Path
          body = json.loads(Path("health.json").read_text())
          assert body.get("status") == "ok", body
          assert body.get("mode") == "PAPER_ONLY", body
          assert body.get("orders_authorized") is False, body
          print("PASS: API liveness is healthy and order authorization is false.")
          PY

      - name: Wait for the independent market worker to become ready
        run: |
          set -euo pipefail
          ready=false
          for attempt in $(seq 1 18); do
            code="$(curl --silent --show-error --max-time 20 \
              --output ready.json --write-out '%{http_code}' "$BASE_URL/readyz" || true)"
            if [ "$code" = "200" ] && python - <<'PY'
          import json
          from pathlib import Path
          body = json.loads(Path("ready.json").read_text())
          assert body.get("status") == "ready"
          assert body.get("worker_status") == "RUNNING"
          assert body.get("orders_authorized") is False
          PY
            then
              ready=true
              echo "PASS: API and shared market worker are ready."
              break
            fi
            echo "Worker not ready yet (attempt $attempt/18, HTTP $code); waiting 10 seconds."
            sleep 10
          done
          if [ "$ready" != true ]; then
            echo "::error::The worker did not become ready within the recovery window."
            cat ready.json || true
            exit 1
          fi
