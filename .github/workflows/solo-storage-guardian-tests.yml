name: Solo Storage Guardian Tests

on:
  pull_request:
    paths:
      - "app/engines/storage_guardian.py"
      - "extracted-source/ai-auto-trader-v4-assembly/app/engines/storage_guardian.py"
      - "tests/test_storage_guardian.py"
      - "tests/test_storage_guardian_mirror.py"
      - ".github/workflows/solo-storage-guardian-tests.yml"
      - "pyproject.toml"

permissions:
  contents: read

jobs:
  storage-guardian-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[test]"
      - name: Run Storage Guardian and mirror tests
        run: python -m pytest -q tests/test_storage_guardian.py tests/test_storage_guardian_mirror.py
