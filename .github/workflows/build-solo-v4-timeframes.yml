# Trigger refresh: request a fresh Solo APK CI run; trading remains disabled.
# Re-run after synchronized source-copy repair.
name: Solo V4 Extended Timeframes and Branding

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/build-solo-v4-timeframes.yml"
      - "android/app/src/main/AndroidManifest.xml"
      - "android/app/src/main/java/com/aiautotrader/v4/MainActivity.kt"
      - "android/app/src/main/res/drawable/ic_solo_logo.xml"
      - "android/app/src/test/**"
      - "android/app/build.gradle.kts"
      - "app/core/**"
      - "app/engines/orchestrator.py"
      - "app/engines/paper_ledger.py"
      - "extracted-source/ai-auto-trader-v4-assembly/android/app/src/main/AndroidManifest.xml"
      - "extracted-source/ai-auto-trader-v4-assembly/android/app/src/main/java/com/aiautotrader/v4/MainActivity.kt"
      - "extracted-source/ai-auto-trader-v4-assembly/android/app/src/main/res/drawable/ic_solo_logo.xml"
      - "extracted-source/ai-auto-trader-v4-assembly/android/app/src/test/java/com/aiautotrader/v4/**"
      - "extracted-source/ai-auto-trader-v4-assembly/android/app/build.gradle.kts"
      - "extracted-source/ai-auto-trader-v4-assembly/tests/test_android_technical_analysis_contract.py"
      - "extracted-source/ai-auto-trader-v4-assembly/tests/test_read_only_api.py"
      - "extracted-source/ai-auto-trader-v4-assembly/backend/binance_spot_testnet_account.py"
      - "app/engines/read_only_api.py"
      - "backend/binance_spot_testnet_account.py"
      - "backend/timeframe_aggregation.py"
      - "tests/**"
      - "backend/**"
      - "PROJECT_COMPLETENESS_AUDIT.md"
      - "extracted-source/ai-auto-trader-v4-assembly/app/core/models.py"
      - "extracted-source/ai-auto-trader-v4-assembly/app/core/risk_guardian.py"
      - "extracted-source/ai-auto-trader-v4-assembly/app/engines/orchestrator.py"
      - "extracted-source/ai-auto-trader-v4-assembly/app/engines/paper_ledger.py"
      - "extracted-source/ai-auto-trader-v4-assembly/tests/test_risk_guardian.py"
      - "extracted-source/ai-auto-trader-v4-assembly/tests/test_risk_guardian_additional.py"
      - "extracted-source/ai-auto-trader-v4-assembly/tests/test_risk_guardian_malformed_inputs.py"
      - "extracted-source/ai-auto-trader-v4-assembly/tests/test_orchestrator.py"
      - "extracted-source/ai-auto-trader-v4-assembly/app/engines/read_only_api.py"
      - "extracted-source/ai-auto-trader-v4-assembly/app/engines/postgres_ssl.py"
      - "extracted-source/ai-auto-trader-v4-assembly/app/engines/postgres_paper_ledger.py"
      - "extracted-source/ai-auto-trader-v4-assembly/backend/timeframe_aggregation.py"
      - "extracted-source/ai-auto-trader-v4-assembly/backend/backtesting.py"

permissions:
  contents: read

concurrency:
  group: solo-v4-extended-timeframes-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test dependencies
        run: python -m pip install -e ".[test]"

      - name: Run backend and Android contract tests
        run: python -m pytest -q tests backend/tests

      - name: Verify Render package matches tested backend candle API
        shell: bash
        run: |
          set -euo pipefail
          cmp app/engines/read_only_api.py extracted-source/ai-auto-trader-v4-assembly/app/engines/read_only_api.py
          cmp app/engines/paper_runtime.py extracted-source/ai-auto-trader-v4-assembly/app/engines/paper_runtime.py
          cmp backend/timeframe_aggregation.py extracted-source/ai-auto-trader-v4-assembly/backend/timeframe_aggregation.py
          cmp backend/backtesting.py extracted-source/ai-auto-trader-v4-assembly/backend/backtesting.py
          cmp backend/binance_spot_testnet_account.py extracted-source/ai-auto-trader-v4-assembly/backend/binance_spot_testnet_account.py
          cmp app/core/models.py extracted-source/ai-auto-trader-v4-assembly/app/core/models.py
          cmp app/core/risk_guardian.py extracted-source/ai-auto-trader-v4-assembly/app/core/risk_guardian.py
          cmp app/engines/orchestrator.py extracted-source/ai-auto-trader-v4-assembly/app/engines/orchestrator.py
          cmp app/engines/paper_ledger.py extracted-source/ai-auto-trader-v4-assembly/app/engines/paper_ledger.py
          cmp app/engines/paper_service_app.py extracted-source/ai-auto-trader-v4-assembly/app/engines/paper_service_app.py
          cmp app/engines/paper_sizing.py extracted-source/ai-auto-trader-v4-assembly/app/engines/paper_sizing.py
          cmp tests/test_risk_guardian.py extracted-source/ai-auto-trader-v4-assembly/tests/test_risk_guardian.py
          cmp tests/test_risk_guardian_additional.py extracted-source/ai-auto-trader-v4-assembly/tests/test_risk_guardian_additional.py
          cmp tests/test_risk_guardian_malformed_inputs.py extracted-source/ai-auto-trader-v4-assembly/tests/test_risk_guardian_malformed_inputs.py
          cmp tests/test_orchestrator.py extracted-source/ai-auto-trader-v4-assembly/tests/test_orchestrator.py
          cmp android/app/src/main/java/com/aiautotrader/v4/MainActivity.kt extracted-source/ai-auto-trader-v4-assembly/android/app/src/main/java/com/aiautotrader/v4/MainActivity.kt
          cmp android/app/src/main/AndroidManifest.xml extracted-source/ai-auto-trader-v4-assembly/android/app/src/main/AndroidManifest.xml
          cmp android/app/src/main/res/drawable/ic_solo_logo.xml extracted-source/ai-auto-trader-v4-assembly/android/app/src/main/res/drawable/ic_solo_logo.xml
          cmp android/app/build.gradle.kts extracted-source/ai-auto-trader-v4-assembly/android/app/build.gradle.kts
          cmp android/app/src/main/res/values/styles.xml extracted-source/ai-auto-trader-v4-assembly/android/app/src/main/res/values/styles.xml
          cmp android/app/src/test/java/com/aiautotrader/v4/MarketAnalysisChecksTest.kt extracted-source/ai-auto-trader-v4-assembly/android/app/src/test/java/com/aiautotrader/v4/MarketAnalysisChecksTest.kt
          cmp android/app/src/test/java/com/aiautotrader/v4/CandlestickPatternTest.kt extracted-source/ai-auto-trader-v4-assembly/android/app/src/test/java/com/aiautotrader/v4/CandlestickPatternTest.kt
          cmp android/app/src/test/java/com/aiautotrader/v4/TimeframeBiasTest.kt extracted-source/ai-auto-trader-v4-assembly/android/app/src/test/java/com/aiautotrader/v4/TimeframeBiasTest.kt
          cmp android/app/src/test/java/com/aiautotrader/v4/TestnetAccountDiagnosticTest.kt extracted-source/ai-auto-trader-v4-assembly/android/app/src/test/java/com/aiautotrader/v4/TestnetAccountDiagnosticTest.kt
          cmp tests/test_android_technical_analysis_contract.py extracted-source/ai-auto-trader-v4-assembly/tests/test_android_technical_analysis_contract.py
          cmp tests/test_read_only_api.py extracted-source/ai-auto-trader-v4-assembly/tests/test_read_only_api.py
          cmp tests/test_paper_ledger.py extracted-source/ai-auto-trader-v4-assembly/tests/test_paper_ledger.py
          echo "PASS: checked Android source/tests and backend files match their Render package copies."

      - name: Compile Python modules
        run: |
          set -euo pipefail
          python -m compileall -q app backend
          python -m compileall -q extracted-source/ai-auto-trader-v4-assembly/app extracted-source/ai-auto-trader-v4-assembly/backend

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Run Android market-analysis unit tests
        run: gradle :android:app:testDebugUnitTest -PpaperApiBaseUrl=https://ai-auto-trader-v4-backend.onrender.com --no-daemon

      - name: Build Solo debug APK
        run: |
          set -euo pipefail
          gradle :android:app:assembleDebug -PpaperApiBaseUrl=https://ai-auto-trader-v4-backend.onrender.com --no-daemon
          APK="android/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          ls -lh "$APK"
          sha256sum "$APK"

      - name: Upload installable debug APK
        uses: actions/upload-artifact@v4
        with:
          name: solo-v4-extended-timeframes-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
