name: Solo WebSocket Recovery Regression Tests

on:
  push:
    branches:
      - test/websocket-recovery-auth-guards
    paths:
      - 'android/app/src/main/**'
      - 'android/app/src/test/**'
      - '.github/workflows/websocket-recovery-regression.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: solo-websocket-recovery-regression
  cancel-in-progress: false

jobs:
  android-unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Run Android unit tests
        run: gradle :android:app:testDebugUnitTest --no-daemon
      - name: Build debug APK
        run: gradle :android:app:assembleDebug --no-daemon
