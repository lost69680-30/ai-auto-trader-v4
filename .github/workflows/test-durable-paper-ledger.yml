name: Durable paper ledger tests

on:
  push:
    branches:
      - feature/supabase-durable-ledger
    paths:
      - "extracted-source/ai-auto-trader-v4-assembly/**"
      - "supabase/migrations/**"
      - ".github/workflows/test-durable-paper-ledger.yml"
  pull_request:
    paths:
      - "extracted-source/ai-auto-trader-v4-assembly/**"
      - "supabase/migrations/**"
      - ".github/workflows/test-durable-paper-ledger.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: durable-paper-ledger-tests
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      PAPER_TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: extracted-source/ai-auto-trader-v4-assembly/pyproject.toml
      - name: Install backend and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e "./extracted-source/ai-auto-trader-v4-assembly[test]"
      - name: Apply schema to disposable PostgreSQL service
        env:
          PGPASSWORD: postgres
        run: |
          psql "postgresql://postgres:postgres@127.0.0.1:5432/postgres" \
            -v ON_ERROR_STOP=1 \
            -f supabase/migrations/20261029205318_create_paper_ledger_schema.sql
          psql "postgresql://postgres:postgres@127.0.0.1:5432/postgres" \
            -v ON_ERROR_STOP=1 \
            -f supabase/migrations/20261030195452_create_shared_market_data.sql
          psql "postgresql://postgres:postgres@127.0.0.1:5432/postgres" \
            -v ON_ERROR_STOP=1 \
            -f supabase/migrations/20261030195505_create_durable_scheduled_jobs.sql
      - name: Apply candle archive schema to disposable PostgreSQL service
        run: |
          psql "postgresql://postgres:postgres@127.0.0.1:5432/postgres" \
            -v ON_ERROR_STOP=1 \
            -f supabase/migrations/20261031034208_create_market_candle_archive.sql
      - name: Run PostgreSQL scheduler and shared-market recovery tests
        working-directory: extracted-source/ai-auto-trader-v4-assembly
        run: python -m pytest -q -rs tests/test_durable_scheduler.py tests/test_shared_market_data_store.py
      - name: Run the complete backend test suite
        working-directory: extracted-source/ai-auto-trader-v4-assembly
        run: python -m pytest -q
