name: Solo staging Render keep-warm and readiness

on:
  push:
    branches: [main, fix/solo-keepwarm-cold-start-window]
    paths:
      - .github/workflows/solo-render-keepwarm.yml
  schedule:
    # Ten-minute cadence reduces idle spin-down while keeping public Actions usage bounded.
    # GitHub scheduled execution remains best-effort, not an uptime guarantee.
    - cron: "3,13,23,33,43,53 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: solo-staging-render-keepwarm
  cancel-in-progress: false

jobs:
  monitor-and-recover:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Wake worker, verify independent heartbeat, and recover confirmed failure
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          API_READY_URL: https://solo-ai-auto-trader-staging-api.onrender.com/readyz
          WORKER_LIVENESS_URL: https://solo-futures-websocket-staging.onrender.com/healthz
          RENDER_WORKER_SERVICE_ID: srv-dbhr5ign74is738detbg
        run: python scripts/solo_independent_watchdog.py
