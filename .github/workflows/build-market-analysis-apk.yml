name: Solo - Staging Market Analysis APK Build

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/build-market-analysis-apk.yml"
      - "android/**"
      - "extracted-source/ai-auto-trader-v4-assembly/android/**"
      - "extracted-source/ai-auto-trader-v4-assembly/*.gradle.kts"
      - "extracted-source/ai-auto-trader-v4-assembly/gradle.properties"
  push:
    paths:
      - ".github/workflows/build-market-analysis-apk.yml"
      - "android/**"
      - "extracted-source/ai-auto-trader-v4-assembly/android/**"
      - "extracted-source/ai-auto-trader-v4-assembly/*.gradle.kts"
      - "extracted-source/ai-auto-trader-v4-assembly/gradle.properties"

permissions:
  contents: read

concurrency:
  group: solo-staging-market-analysis-apk
  cancel-in-progress: false

jobs:
  build:
    name: Test and build Android APK against staging API
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set project directory
        shell: bash
        run: |
          set -euo pipefail
          PROJECT="$GITHUB_WORKSPACE/extracted-source/ai-auto-trader-v4-assembly"
          test -f "$PROJECT/settings.gradle.kts"
          test -f "$PROJECT/android/app/build.gradle.kts"
          echo "PROJECT_DIR=$PROJECT" >> "$GITHUB_ENV"

      - name: Configure Gradle memory and AndroidX
        shell: bash
        run: |
          set -euo pipefail
          touch "$PROJECT_DIR/gradle.properties"
          if grep -q '^org.gradle.jvmargs=' "$PROJECT_DIR/gradle.properties"; then
            sed -i 's|^org.gradle.jvmargs=.*|org.gradle.jvmargs=-Xmx1536m -XX:MaxMetaspaceSize=512m -Dfile.encoding=UTF-8|' "$PROJECT_DIR/gradle.properties"
          else
            printf '\norg.gradle.jvmargs=-Xmx1536m -XX:MaxMetaspaceSize=512m -Dfile.encoding=UTF-8\n' >> "$PROJECT_DIR/gradle.properties"
          fi
          if ! grep -q '^android.useAndroidX=' "$PROJECT_DIR/gradle.properties"; then
            printf '\nandroid.useAndroidX=true\n' >> "$PROJECT_DIR/gradle.properties"
          fi

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Select staging API target
        shell: bash
        run: |
          set -euo pipefail
          PAPER_API_BASE_URL="https://solo-ai-auto-trader-staging-api.onrender.com"
          case "$PAPER_API_BASE_URL" in
            https://solo-ai-auto-trader-staging-api.onrender.com) ;;
            *) echo "Unexpected staging API target; refusing to build." >&2; exit 1 ;;
          esac
          echo "PAPER_API_BASE_URL=$PAPER_API_BASE_URL" >> "$GITHUB_ENV"
          echo "APK target is the dedicated staging API. No bearer or exchange credentials are embedded."

      - name: Verify Android source mirrors match
        shell: bash
        run: |
          set -euo pipefail
          ROOT_MAIN="$GITHUB_WORKSPACE/android/app/src/main"
          EXTRACTED_MAIN="$PROJECT_DIR/android/app/src/main"
          ROOT_TEST="$GITHUB_WORKSPACE/android/app/src/test"
          EXTRACTED_TEST="$PROJECT_DIR/android/app/src/test"
          for relative in \
            java/com/aiautotrader/v4/MainActivity.kt \
            java/com/aiautotrader/v4/MarketObservationFreshness.kt \
            java/com/aiautotrader/v4/MarketWebSocketClient.kt \
            java/com/aiautotrader/v4/PaperLedgerClient.kt; do
            cmp "$ROOT_MAIN/$relative" "$EXTRACTED_MAIN/$relative" || { echo "Android main-source mirror mismatch: $relative"; exit 1; }
          done
          for relative in \
            java/com/aiautotrader/v4/MarketAnalysisChecksTest.kt \
            java/com/aiautotrader/v4/MarketWebSocketClientTest.kt \
            java/com/aiautotrader/v4/PaperLedgerClientTest.kt; do
            cmp "$ROOT_TEST/$relative" "$EXTRACTED_TEST/$relative" || { echo "Android test-source mirror mismatch: $relative"; exit 1; }
          done

      - name: Run Android unit tests and build staging APK
        shell: bash
        run: |
          set -euo pipefail
          # Only the public staging URL is compiled into this APK. Secrets remain outside the APK.
          gradle -p "$PROJECT_DIR" :android:app:testDebugUnitTest :android:app:assembleDebug \
            -PpaperApiBaseUrl="$PAPER_API_BASE_URL" \
            --no-daemon --max-workers=2
          BUILD_CONFIG="$PROJECT_DIR/android/app/build/generated/source/buildConfig/debug/com/aiautotrader/v4/BuildConfig.java"
          test -s "$BUILD_CONFIG"
          grep -F 'https://solo-ai-auto-trader-staging-api.onrender.com' "$BUILD_CONFIG"
          if grep -Fq 'ai-auto-trader-v4-backend.onrender.com' "$BUILD_CONFIG"; then
            echo "Production backend URL found in staging APK configuration; refusing artifact." >&2
            exit 1
          fi

      - name: Verify APK exists and is non-empty
        shell: bash
        run: |
          set -euo pipefail
          APK="$PROJECT_DIR/android/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          sha256sum "$APK"
          ls -lh "$APK"

      - name: Upload staging debug APK
        uses: actions/upload-artifact@v4
        with:
          name: solo-staging-market-analysis-debug-apk
          path: ${{ env.PROJECT_DIR }}/android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
