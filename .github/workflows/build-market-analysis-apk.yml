
name: AI Auto Trader V4 - Market Analysis APK Build

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/build-market-analysis-apk.yml"
      - "ai-auto-trader-v4-emergency-stop-v7.zip"

permissions:
  contents: read

concurrency:
  group: market-analysis-apk
  cancel-in-progress: false

jobs:
  build:
    name: Validate and build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Check project archive
        shell: bash
        run: |
          set -euo pipefail
          test -f ai-auto-trader-v4-emergency-stop-v7.zip
          unzip -t ai-auto-trader-v4-emergency-stop-v7.zip

      - name: Extract Android project
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/ai-auto-trader"
          unzip -q ai-auto-trader-v4-emergency-stop-v7.zip \
            -d "$RUNNER_TEMP/ai-auto-trader"

          PROJECT="$RUNNER_TEMP/ai-auto-trader/ai-auto-trader-v4-assembly"

          if [ ! -f "$PROJECT/android/app/build.gradle.kts" ]; then
            echo "Expected Android Gradle file was not found."
            find "$RUNNER_TEMP/ai-auto-trader" -name build.gradle.kts -print
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT" >> "$GITHUB_ENV"
      - name: Enable AndroidX
        shell: bash
        run: |
          set -euo pipefail
          printf '\nandroid.useAndroidX=true\n' >> "$PROJECT_DIR/gradle.properties"
          cat "$PROJECT_DIR/gradle.properties"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Verify Gradle installation
        shell: bash
        run: gradle --version

      - name: Run Android unit tests
        shell: bash
        run: |
          set -euo pipefail
          gradle -p "$PROJECT_DIR" :android:app:testDebugUnitTest --no-daemon

      - name: Build debug APK
        shell: bash
        run: |
          set -euo pipefail
          gradle -p "$PROJECT_DIR" :android:app:assembleDebug --no-daemon

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: ai-auto-trader-v4-market-analysis-debug-apk
          path: ${{ env.PROJECT_DIR }}/android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
