name: Solo - Market Analysis APK Build

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/build-market-analysis-apk.yml"
      - "android/**"
      - "extracted-source/ai-auto-trader-v4-assembly/android/**"
      - "extracted-source/ai-auto-trader-v4-assembly/*.gradle.kts"
      - "extracted-source/ai-auto-trader-v4-assembly/gradle.properties"
  push:
    paths:
      - ".github/workflows/build-market-analysis-apk.yml"
      - "android/**"
      - "extracted-source/ai-auto-trader-v4-assembly/android/**"
      - "extracted-source/ai-auto-trader-v4-assembly/*.gradle.kts"
      - "extracted-source/ai-auto-trader-v4-assembly/gradle.properties"

permissions:
  contents: read

concurrency:
  group: solo-market-analysis-apk
  cancel-in-progress: false

jobs:
  build:
    name: Test and build Android APK from repository source
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set project directory
        shell: bash
        run: |
          set -euo pipefail
          PROJECT="$GITHUB_WORKSPACE/extracted-source/ai-auto-trader-v4-assembly"
          test -f "$PROJECT/settings.gradle.kts"
          test -f "$PROJECT/android/app/build.gradle.kts"
          echo "PROJECT_DIR=$PROJECT" >> "$GITHUB_ENV"

      - name: Configure Gradle memory and AndroidX
        shell: bash
        run: |
          set -euo pipefail
          touch "$PROJECT_DIR/gradle.properties"
          if grep -q '^org.gradle.jvmargs=' "$PROJECT_DIR/gradle.properties"; then
            sed -i 's|^org.gradle.jvmargs=.*|org.gradle.jvmargs=-Xmx1536m -XX:MaxMetaspaceSize=512m -Dfile.encoding=UTF-8|' "$PROJECT_DIR/gradle.properties"
          else
            printf '\norg.gradle.jvmargs=-Xmx1536m -XX:MaxMetaspaceSize=512m -Dfile.encoding=UTF-8\n' >> "$PROJECT_DIR/gradle.properties"
          fi
          if ! grep -q '^android.useAndroidX=' "$PROJECT_DIR/gradle.properties"; then
            printf '\nandroid.useAndroidX=true\n' >> "$PROJECT_DIR/gradle.properties"
          fi

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Run Android unit tests and build APK
        shell: bash
        run: |
          set -euo pipefail
          # The Gradle property is required: build.gradle.kts defaults this URL to blank.
          # This is a public backend URL, not a credential; bearer tokens stay out of the APK.
          gradle -p "$PROJECT_DIR" :android:app:testDebugUnitTest :android:app:assembleDebug \
            -PpaperApiBaseUrl=https://ai-auto-trader-v4-backend.onrender.com \
            --no-daemon --max-workers=2

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: solo-market-analysis-debug-apk
          path: ${{ env.PROJECT_DIR }}/android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
