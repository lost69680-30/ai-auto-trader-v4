name: Build Solo Staging APK

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/build-apk.yml'
      - 'android/**'
      - 'extracted-source/ai-auto-trader-v4-assembly/android/**'
      - 'extracted-source/ai-auto-trader-v4-assembly/settings.gradle.kts'
      - 'extracted-source/ai-auto-trader-v4-assembly/gradle.properties'
      - 'extracted-source/ai-auto-trader-v4-assembly/app/engines/read_only_api.py'
      - 'extracted-source/ai-auto-trader-v4-assembly/backend/spot_historical_research.py'
      - 'app/engines/read_only_api.py'
      - 'backend/spot_historical_research.py'

permissions:
  contents: read

jobs:
  build-debug-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout staging source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Verify synchronized Solo project and Spot backtest integration
        shell: bash
        run: |
          set -euo pipefail
          PROJECT_DIR="extracted-source/ai-auto-trader-v4-assembly"
          test -f "$PROJECT_DIR/settings.gradle.kts"
          test -f "$PROJECT_DIR/android/app/build.gradle.kts"
          test -f "$PROJECT_DIR/android/app/src/main/AndroidManifest.xml"
          test -f "$PROJECT_DIR/android/app/src/main/java/com/aiautotrader/v4/MainActivity.kt"
          test -f "$PROJECT_DIR/android/app/src/main/java/com/aiautotrader/v4/BackendTokenStore.kt"
          test -f "$PROJECT_DIR/app/engines/read_only_api.py"
          test -f "$PROJECT_DIR/backend/spot_historical_research.py"
          grep -Fq '/api/v1/spot/backtest' "$PROJECT_DIR/app/engines/read_only_api.py"
          grep -Fq 'HISTORICAL SPOT BACKTEST' "$PROJECT_DIR/android/app/src/main/java/com/aiautotrader/v4/MainActivity.kt"
          grep -Fq 'orders_authorized' "$PROJECT_DIR/backend/spot_historical_research.py"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "PASS: building the synchronized staging source, not the legacy ZIP."

      - name: Build debug APK
        shell: bash
        run: |
          set -euo pipefail
          gradle -p "$PROJECT_DIR" :android:app:assembleDebug \
            -PpaperApiBaseUrl=https://ai-auto-trader-v4-backend.onrender.com \
            --no-daemon

      - name: Verify installable APK and safety integration
        shell: bash
        run: |
          set -euo pipefail
          APK="$PROJECT_DIR/android/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          unzip -t "$APK"
          echo "APK_DETAILS:"
          ls -lh "$APK"
          sha256sum "$APK"
          echo "APK_METADATA:"
          unzip -l "$APK" | grep -E 'AndroidManifest.xml|classes[0-9]*\.dex' | head -20

      - name: Upload installable debug APK
        uses: actions/upload-artifact@v4
        with:
          name: solo-historical-spot-backtest-debug-apk
          path: extracted-source/ai-auto-trader-v4-assembly/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Package exact source used for APK
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          zip -qr "$GITHUB_WORKSPACE/solo-staging-apk-source.zip" . \
            -x '**/build/**' '**/.gradle/**' '**/.git/**'

      - name: Upload exact APK source snapshot
        uses: actions/upload-artifact@v4
        with:
          name: solo-staging-apk-source
          path: solo-staging-apk-source.zip
          if-no-files-found: error
          retention-days: 14
