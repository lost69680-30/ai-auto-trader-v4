
name: Build AI Auto Trader APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'ai-auto-trader-v4-consolidated-audit-backend-resumed.zip'
      - 'ai-auto-trader-v4-assembly.zip'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: read

jobs:
  build-debug-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract updated project ZIP
        shell: bash
        run: |
          set -euo pipefail
          if [ -f ai-auto-trader-v4-consolidated-audit-backend-resumed.zip ]; then
            PROJECT_ZIP=ai-auto-trader-v4-consolidated-audit-backend-resumed.zip
          elif [ -f ai-auto-trader-v4-assembly.zip ]; then
            PROJECT_ZIP=ai-auto-trader-v4-assembly.zip
          else
            echo "Project ZIP not found"
            exit 1
          fi
          mkdir -p extracted-project
          unzip -q "$PROJECT_ZIP" -d extracted-project
          PROJECT_DIR=extracted-project/ai-auto-trader-v4-assembly
          test -f "$PROJECT_DIR/settings.gradle.kts"
          test -f "$PROJECT_DIR/android/app/build.gradle.kts"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Configure Android build
        shell: bash
        run: |
          set -euo pipefail
          touch "$PROJECT_DIR/gradle.properties"
          echo 'android.useAndroidX=true' >> "$PROJECT_DIR/gradle.properties"
          echo 'org.gradle.jvmargs=-Xmx2g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8' >> "$PROJECT_DIR/gradle.properties"
          echo 'kotlin.daemon.jvmargs=-Xmx1g' >> "$PROJECT_DIR/gradle.properties"

      - name: Build Android debug APK
        run: gradle -p "$PROJECT_DIR" :android:app:assembleDebug --no-daemon

      - name: Verify APK
        run: test -s "$PROJECT_DIR/android/app/build/outputs/apk/debug/app-debug.apk"

      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: ai-auto-trader-v4-debug-apk
          path: extracted-project/ai-auto-trader-v4-assembly/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
