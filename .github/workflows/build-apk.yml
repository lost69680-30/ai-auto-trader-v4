
name: Build AI Auto Trader APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'ai-auto-trader-v4-assembly.zip'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: read

jobs:
  build-debug-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check uploaded project
        run: test -f ai-auto-trader-v4-assembly.zip

      - name: Extract project
        run: |
          unzip -q ai-auto-trader-v4-assembly.zip
          test -f ai-auto-trader-v4-assembly/settings.gradle.kts
          test -f ai-auto-trader-v4-assembly/android/app/build.gradle.kts

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build Android APK
        working-directory: ai-auto-trader-v4-assembly
        run: gradle :android:app:assembleDebug --no-daemon

      - name: Save installable APK
        uses: actions/upload-artifact@v4
        with:
          name: ai-auto-trader-v4-debug-apk
          path: ai-auto-trader-v4-assembly/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
