
name: Build AI Auto Trader APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'ai-auto-trader-v4-consolidated-audit-backend-resumed.zip'
      - 'ai-auto-trader-v4-assembly.zip'
      - 'ai-auto-trader-v4-emergency-stop-v7.zip'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: read

jobs:
  build-debug-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract updated project ZIP
        shell: bash
        run: |
          set -euo pipefail

          if [ -f ai-auto-trader-v4-emergency-stop-v7.zip ]; then
            PROJECT_ZIP=ai-auto-trader-v4-emergency-stop-v7.zip
          elif [ -f ai-auto-trader-v4-consolidated-audit-backend-resumed.zip ]; then
            PROJECT_ZIP=ai-auto-trader-v4-consolidated-audit-backend-resumed.zip
          elif [ -f ai-auto-trader-v4-assembly.zip ]; then
            PROJECT_ZIP=ai-auto-trader-v4-assembly.zip
          else
            echo "ERROR: No supported project ZIP found in repository root."
            exit 1
          fi

          echo "Selected project archive: $PROJECT_ZIP"
          mkdir -p extracted-project
          unzip -q "$PROJECT_ZIP" -d extracted-project

          PROJECT_DIR=extracted-project/ai-auto-trader-v4-assembly

          if [ ! -f "$PROJECT_DIR/settings.gradle.kts" ]; then
            echo "ERROR: settings.gradle.kts not found at $PROJECT_DIR"
            echo "Archive contents:"
            find extracted-project -maxdepth 4 -type f | head -100
            exit 1
          fi

          if [ ! -f "$PROJECT_DIR/android/app/build.gradle.kts" ]; then
            echo "ERROR: Android app Gradle file not found."
            find extracted-project -maxdepth 5 -type f | head -100
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Configure Android build
        shell: bash
        run: |
          set -euo pipefail
          touch "$PROJECT_DIR/gradle.properties"
          echo 'android.useAndroidX=true' >> "$PROJECT_DIR/gradle.properties"
          echo 'org.gradle.jvmargs=-Xmx2g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8' >> "$PROJECT_DIR/gradle.properties"
          echo 'kotlin.daemon.jvmargs=-Xmx1g' >> "$PROJECT_DIR/gradle.properties"

      - name: Build Android debug APK
        run: |
          gradle -p "$PROJECT_DIR" :android:app:assembleDebug \
            -PpaperApiBaseUrl=https://ai-auto-trader-v4-backend.onrender.com \
            --no-daemon

      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail
          APK_PATH="$PROJECT_DIR/android/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK_PATH"
          echo "APK built successfully:"
          ls -lh "$APK_PATH"

      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: ai-auto-trader-v4-debug-apk
          path: extracted-project/ai-auto-trader-v4-assembly/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
