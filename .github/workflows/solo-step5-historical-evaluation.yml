name: Solo V4 Step 5 - Historical Evaluation
on:
  push:
    paths:
      - ".github/workflows/solo-step5-historical-evaluation.yml"
  workflow_dispatch:
    inputs:
      symbol:
        description: Binance Spot symbol
        required: true
        default: BTCUSDT
        type: string
permissions:
  contents: read
concurrency:
  group: solo-v4-step5-historical-evaluation
  cancel-in-progress: false
jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[test]"
      - name: Fetch and evaluate public closed candles
        env:
          SYMBOL: ${{ inputs.symbol }}
        run: |
          python - <<'PY'
          import json, os, re, urllib.parse, urllib.request
          from datetime import datetime, timezone
          from pathlib import Path
          from backend.strategy_research import Candle
          from backend.strategy_diagnostics import diagnose_strategy_signal_activity
          from backend.backtesting import BacktestConfig
          from backend.walk_forward import WalkForwardConfig, evaluate_walk_forward
          symbol = os.environ.get("SYMBOL", "").strip() or "BTCUSDT"
          if not re.fullmatch(r"[A-Z0-9]{5,20}", symbol):
              raise SystemExit("Invalid symbol format")
          url = "https://data-api.binance.vision/api/v3/klines?" + urllib.parse.urlencode({"symbol": symbol, "interval": "1h", "limit": 1000})
          request = urllib.request.Request(url, headers={"User-Agent": "SoloV4-Research/1.0"})
          with urllib.request.urlopen(request, timeout=30) as response:
              raw = json.load(response)
          if not isinstance(raw, list) or not raw or any(not isinstance(row, list) or len(row) < 12 for row in raw):
              raise SystemExit("Public kline response has an unexpected schema or contains no rows")
          now = datetime.now(timezone.utc)
          candles = []
          for row in raw:
              close_ms = int(row[6])
              if datetime.fromtimestamp(close_ms / 1000, timezone.utc) >= now:
                  continue
              candles.append(Candle(symbol, datetime.fromtimestamp(int(row[0]) / 1000, timezone.utc),
                                    float(row[1]), float(row[2]), float(row[3]), float(row[4]), float(row[5])))
          if len(candles) < 700:
              raise SystemExit(f"Not enough closed hourly candles for the frozen evaluation protocol: need at least 700, got {len(candles)}")
          cfg = WalkForwardConfig(train_bars=500, validation_bars=100, holdout_bars=100, step_bars=100, candle_interval_minutes=60)
          result = evaluate_walk_forward(symbol, candles, config=cfg,
                    backtest_config=BacktestConfig(candle_interval_minutes=60),
                    research_now=candles[-1].timestamp)
          def metrics(window):
              bt = window.strategy
              return {"window": window.name, "start_index": window.start_index, "end_index_exclusive": window.end_index,
                      "strategy_net_return_pct": round(bt.net_pnl / bt.initial_equity * 100, 6),
                      "strategy_max_drawdown_pct": bt.max_drawdown_pct, "trade_count": bt.trade_count,
                      "win_rate_pct": bt.win_rate_pct, "estimated_costs": bt.total_costs,
                      "buy_hold_return_pct": window.buy_hold_return_pct, "cash_return_pct": window.cash_return_pct,
                      "used_for_selection": window.used_for_selection, "orders_authorized": bt.orders_authorized}
          # Diagnose activation only on the walk-forward folds. The final holdout is
          # deliberately omitted so it remains untouched and cannot inform tuning.
          signal_diagnostics = [
              {"window": window.name, **diagnose_strategy_signal_activity(
                  symbol, candles,
                  signal_start_index=window.start_index - 1,
                  signal_end_index_exclusive=window.end_index - 2,
                  minimum_signal_score=60.0,
              )}
              for window in result.folds
          ]
          report = {"report_type": "historical_research_only", "source": "Binance Spot public klines REST API",
                    "symbol": symbol, "interval": "1h", "candle_count": len(candles),
                    "first_candle_utc": candles[0].timestamp.isoformat(), "last_candle_utc": candles[-1].timestamp.isoformat(),
                    "evaluated_at_utc": now.isoformat(),
                    "protocol": {"train_bars_warmup_only": 500, "validation_bars": 100,
                                 "holdout_bars": 100, "step_bars": 100,
                                 "holdout_used_for_selection": False},
                    "backtest_assumptions": {"initial_equity": 10000.0, "position_fraction": 0.10,
                                             "fee_bps_per_side": 4.0, "slippage_bps_per_side": 2.0,
                                             "funding_bps_per_8h": 1.0, "fill_model": "next-open entry and following-open exit"},
                    "folds": [metrics(w) for w in result.folds],
                    "signal_diagnostics": {
                        "scope": "walk_forward_folds_only",
                        "untouched_holdout_included": False,
                        "minimum_signal_score": 60.0,
                        "windows": signal_diagnostics,
                        "orders_authorized": False,
                    },
                    "untouched_holdout": metrics(result.holdout), "warnings": list(result.warnings),
                    "orders_authorized": False}
          Path("historical-evaluation-report.json").write_text(json.dumps(report, indent=2) + "\n")
          print(json.dumps(report, indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: solo-v4-historical-evaluation-report
          path: historical-evaluation-report.json
          if-no-files-found: error
          retention-days: 30
