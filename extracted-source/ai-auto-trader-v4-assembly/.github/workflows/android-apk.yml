name: Build Android APK

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'android/**'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - '.github/workflows/android-apk.yml'
  push:
    paths:
      - 'android/**'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - '.github/workflows/android-apk.yml'

permissions:
  contents: read

jobs:
  build-debug-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Validate optional API URL
        env:
          PAPER_API_BASE_URL: ${{ vars.PAPER_API_BASE_URL }}
        run: |
          if [ -n "$PAPER_API_BASE_URL" ]; then
            case "$PAPER_API_BASE_URL" in
              https://*) ;;
              *) echo "PAPER_API_BASE_URL must use HTTPS" >&2; exit 1 ;;
            esac
          fi
      - name: Build debug APK
        env:
          PAPER_API_BASE_URL: ${{ vars.PAPER_API_BASE_URL }}
        run: gradle -PpaperApiBaseUrl="$PAPER_API_BASE_URL" :android:app:assembleDebug --no-daemon
      - name: Verify APK exists and is non-empty
        run: test -s android/app/build/outputs/apk/debug/app-debug.apk
      - name: Upload installable debug APK
        uses: actions/upload-artifact@v4
        with:
          name: ai-auto-trader-v4-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
