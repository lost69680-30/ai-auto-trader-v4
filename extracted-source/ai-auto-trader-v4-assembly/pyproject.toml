[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-auto-trader-v4-assembly"
version = "0.1.0"
description = "AI Auto Trader v4 research engines and safety-first assembly baseline"
requires-python = ">=3.11"

[project.optional-dependencies]
test = ["pytest>=8.0"]

[tool.pytest.ini_options]
testpaths = ["tests", "backend/tests"]
pythonpath = ["."]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*", "backend*"]
exclude = ["tests*"]
